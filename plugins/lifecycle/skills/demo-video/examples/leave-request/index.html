<!doctype html>
<html lang="zh-TW">
<meta charset="utf-8">
<title>請假申請（示範）</title>
<style>
  body { font: 20px/1.5 system-ui, 'PingFang TC', sans-serif; margin: 0; background: #f4f6fa; color: #1c2430; }
  header { background: #1976d2; color: #fff; padding: 18px 40px; font-size: 24px; }
  main { max-width: 640px; margin: 16px auto; background: #fff; padding: 12px 40px 20px; border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
  h1 { font-size: 24px; margin: 8px 0; }
  label { display: block; margin-top: 10px; font-weight: 600; }
  input, select, textarea { width: 100%; box-sizing: border-box; font: inherit; padding: 8px 10px; margin-top: 6px; border: 1px solid #b8c2d0; border-radius: 6px; }
  button { margin-top: 14px; font: inherit; padding: 10px 28px; border: 0; border-radius: 6px; background: #1976d2; color: #fff; cursor: pointer; }
  #done { display: none; margin: 8px 0; padding: 14px; background: #e6f4ea; border-radius: 6px; }
</style>
<header>員工入口</header>
<main>
  <h1>請假申請</h1>
  <div id="done" role="status"></div>
  <form id="f">
    <label for="type">假別</label>
    <select id="type"><option>特休</option><option>事假</option><option>病假</option></select>
    <label for="date">請假日期</label>
    <input id="date" type="date">
    <label for="reason">事由</label>
    <textarea id="reason" rows="2"></textarea>
    <button type="submit">送出申請</button>
  </form>
</main>
<script>
  document.getElementById('f').addEventListener('submit', (e) => {
    e.preventDefault()
    const d = document.getElementById('done')
    d.textContent = `已送出：${type.value}，${date.value}，等待主管簽核`
    d.style.display = 'block'
  })
</script>
</html>
