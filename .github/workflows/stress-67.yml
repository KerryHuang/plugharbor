name: stress-67
on:
  pull_request:
permissions:
  contents: read
jobs:
  stress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: test-lock 連跑
        run: |
          f=0
          for i in $(seq 1 200); do
            out=$(bash plugins/workspace/skills/unattended/tests/test-lock.sh 2>&1) || true
            if echo "$out" | grep -q FAIL; then f=$((f+1)); echo "=== run $i"; echo "$out"; fi
          done
          echo "test-lock fails=$f/200"
      - name: killSync 連跑（加 CPU 負載）
        run: |
          for k in 1 2 3 4; do (timeout 900 sh -c 'while :; do :; done' &) ; done
          f=0
          for i in $(seq 1 150); do
            node --test --test-name-pattern=killSync plugins/delivery/skills/demo-video/scripts/env.test.mjs >/tmp/o.txt 2>&1 || { f=$((f+1)); echo "=== run $i"; grep -E "true !==|not ok" /tmp/o.txt; }
          done
          echo "killSync fails=$f/150"
