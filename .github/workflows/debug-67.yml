name: debug-67
on:
  pull_request:
permissions:
  contents: read
jobs:
  stress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: test-lock 連跑
        run: |
          f=0
          for i in $(seq 1 120); do
            out=$(bash plugins/workspace/skills/unattended/tests/test-lock.sh 2>&1) || true
            if echo "$out" | grep -q FAIL; then f=$((f+1)); echo "=== run $i"; echo "$out"; fi
          done
          echo "test-lock fails=$f/120"
      - name: killSync 連跑
        run: |
          f=0
          for i in $(seq 1 60); do
            out=$(node --test --test-name-pattern=killSync plugins/delivery/skills/demo-video/scripts/env.test.mjs 2>&1) || { f=$((f+1)); echo "=== run $i"; echo "$out" | grep -E "DEBUG67|true !==|STAT|^ *[0-9]+ " ; }
          done
          echo "killSync fails=$f/60"
      - name: 原子建立原語探測
        run: |
          uname -r
          probe() { # $1=名稱 $2=在 "$l" 上建立的指令（成功回 0）
            both=0; d=$(mktemp -d)
            for i in $(seq 1 600); do
              l="$d/l$i"
              ( sh -c "$2" x "$l" && echo ok >> "$d/r$i.a" ) 2>/dev/null &
              ( sh -c "$2" x "$l" && echo ok >> "$d/r$i.b" ) 2>/dev/null &
              wait
              [ -e "$d/r$i.a" ] && [ -e "$d/r$i.b" ] && both=$((both+1))
            done
            echo "$1 兩邊都成功：$both/600"; rm -rf "$d"
          }
          probe mkdir 'mkdir "$1"'
          probe noclobber 'set -C; echo $$ > "$1"'
          probe ln-hardlink 'echo x > "$1.src.$$"; ln "$1.src.$$" "$1"'
          probe ln-symlink 'ln -s target "$1"'
          probe mkdir-pid 'mkdir "$1" && echo $$ > "$1/pid"'
          probe open-excl "python3 -c 'import os,sys; os.close(os.open(sys.argv[1], os.O_CREAT|os.O_EXCL|os.O_WRONLY))' \"\$1\""
          probe mkdir-py "python3 -c 'import os,sys; os.mkdir(sys.argv[1])' \"\$1\""
          which flock && probe flock-nb 'exec 9>"$1.lk"; flock -n 9 && sleep 0.05'
