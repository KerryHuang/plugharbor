name: debug-67
on:
  pull_request:
permissions:
  contents: read
jobs:
  stress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: test-lock 連跑
        run: |
          f=0
          for i in $(seq 1 120); do
            out=$(bash plugins/workspace/skills/unattended/tests/test-lock.sh 2>&1) || true
            if echo "$out" | grep -q FAIL; then f=$((f+1)); echo "=== run $i"; echo "$out"; fi
          done
          echo "test-lock fails=$f/120"
      - name: killSync 連跑
        run: |
          f=0
          for i in $(seq 1 60); do
            out=$(node --test --test-name-pattern=killSync plugins/delivery/skills/demo-video/scripts/env.test.mjs 2>&1) || { f=$((f+1)); echo "=== run $i"; echo "$out" | grep -E "DEBUG67|true !==|STAT|^ *[0-9]+ " ; }
          done
          echo "killSync fails=$f/60"
      - name: mkdir 原子性探測
        run: |
          echo "--- mount/df"; df -T /tmp "$RUNNER_TEMP" /dev/shm "$HOME" 2>&1; mount | grep -E " / | /tmp " ; uname -r; echo "nproc=$(nproc)"
          probe() {
            base="$1"; both=0
            d=$(mktemp -d -p "$base")
            for i in $(seq 1 1000); do
              l="$d/l$i"
              ( mkdir "$l" 2>/dev/null && echo ok >> "$d/r$i.a" ) &
              ( mkdir "$l" 2>/dev/null && echo ok >> "$d/r$i.b" ) &
              wait
              [ -e "$d/r$i.a" ] && [ -e "$d/r$i.b" ] && both=$((both+1))
            done
            echo "$base 兩邊都 mkdir 成功：$both/1000"; rm -rf "$d"
          }
          probe /tmp; probe "$RUNNER_TEMP"; probe /dev/shm; probe "$HOME"
          echo "--- dash 版"
          cat > "$RUNNER_TEMP/p.sh" <<'EOS'
          d=$(mktemp -d); both=0
          for i in $(seq 1 500); do
            sh -c 'mkdir "$1" 2>/dev/null && echo ok >> "$1.a"' x "$d/l$i" &
            sh -c 'mkdir "$1" 2>/dev/null && echo ok >> "$1.b"' x "$d/l$i" &
            wait
            [ -e "$d/l$i.a" ] && [ -e "$d/l$i.b" ] && both=$((both+1))
          done
          echo "dash mkdir 兩邊成功：$both/500"
          EOS
          bash "$RUNNER_TEMP/p.sh"
