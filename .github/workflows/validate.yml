name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Marketplace 驗證（版號、frontmatter、交互引用、README 清單、外洩樣式）
        run: python scripts/ci/validate.py

      - name: Plugin 腳本測試
        run: |
          pip install pyyaml
          status=0
          for t in $(git ls-files 'plugins/**/test_*.py'); do
            echo "::group::$t"
            python "$t" || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: Skill 腳本測試（node）
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Skill 腳本測試（node --test）
        run: node --test $(git ls-files 'plugins/**/*.test.mjs')

      - name: Hook 測試（pytest 與 shell）
        run: |
          pip install pytest
          python -m pytest plugins/toolkit/hooks/tests -v
          status=0
          for t in $(git ls-files 'plugins/**/tests/*.sh'); do
            echo "::group::$t"
            bash "$t" || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: Setup 腳本測試
        run: |
          status=0
          for t in $(git ls-files 'setup/tests/*.sh'); do
            echo "::group::$t"
            bash "$t" || status=1
            echo "::endgroup::"
          done
          exit $status
