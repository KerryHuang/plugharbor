name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Marketplace 驗證（版號、frontmatter、交互引用、README 清單、外洩樣式）
        run: python scripts/ci/validate.py

      - name: Plugin 腳本測試
        run: |
          pip install pyyaml
          status=0
          # pytest 寫的測試（hooks、transcribe）在後面「Hook 測試」步驟用 pytest 跑，這裡排除
          for t in $(git ls-files 'plugins/**/test_*.py' ':!:plugins/toolkit/hooks/tests/*' ':!:plugins/toolkit/skills/transcribe/tests/*'); do
            echo "::group::$t"
            python "$t" || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: Skill 腳本測試（node）
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Skill 腳本測試（node --test）
        run: node --test $(git ls-files 'plugins/**/*.test.mjs') 'setup/adapters/tests/*.test.mjs'

      - name: demo-video 端到端測試（本機靜態頁＋假 TTS，需 ffmpeg、Chrome、playwright-core）
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          mkdir -p "$RUNNER_TEMP/dv" && cd "$RUNNER_TEMP/dv"
          npm init -y >/dev/null && npm install --silent playwright-core
          # 缺依賴時要失敗，不能跳過後仍顯示成功
          DEMO_VIDEO_E2E_REQUIRED=1 node --test "$GITHUB_WORKSPACE/plugins/lifecycle/skills/demo-video/scripts/e2e.test.mjs"

      - name: Hook 測試（pytest 與 shell）
        run: |
          pip install pytest opencc-python-reimplemented
          python -m pytest plugins/toolkit/hooks/tests -v
          python -m pytest plugins/toolkit/skills/transcribe/tests -v
          status=0
          for t in $(git ls-files 'plugins/**/tests/*.sh' ':!:**/tests/lib/*'); do
            echo "::group::$t"
            bash "$t" || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: Setup 腳本測試
        run: |
          status=0
          for t in $(git ls-files 'setup/tests/*.sh' ':!:setup/tests/lib/*'); do
            echo "::group::$t"
            bash "$t" || status=1
            echo "::endgroup::"
          done
          exit $status
